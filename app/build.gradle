plugins { id 'com.android.application' }

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

android {
    namespace 'com.jam3yati.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jam3yati.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.2.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('JAM3YATI_KEYSTORE')
            def alias = System.getenv('JAM3YATI_KEY_ALIAS')
            def kp = System.getenv('JAM3YATI_KEY_PASSWORD')
            def sp = System.getenv('JAM3YATI_STORE_PASSWORD')
            if (ks && alias && kp && sp) {
                storeFile file(ks)
                storePassword sp
                keyAlias alias
                keyPassword kp
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('JAM3YATI_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}